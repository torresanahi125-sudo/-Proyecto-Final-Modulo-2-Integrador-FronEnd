<!-- Declaración del tipo de documento HTML5 -->
<!DOCTYPE html>
<!-- Idioma principal del sitio (se cambió a "es" para coincidir con el público del TP) -->
<html lang="es">
<head>
  <!-- Configuración de caracteres universales (permite ñ y acentos) -->
  <meta charset="UTF-8">
  <!-- Garantiza que la aplicación se adapte correctamente a pantallas de celulares (Responsive) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Título de la pestaña del navegador -->
  <title>Buscador de Superhéroes - Universo Ada</title>
  <!-- Vinculación con la hoja de estilos final compilada por el preprocesador SASS -->
  <link rel="stylesheet" href="scss/main.css">
</head>
<body>

  <!-- Encabezado principal de la aplicación utilizando semántica HTML5 -->
  <header class="header">
    <!-- Título principal con metodología de clases BEM (Bloque__Elemento) -->
    <h1 class="header__title">Superhero Universe</h1>
  </header>

  <!-- Contenedor principal que aloja todo el espacio de trabajo dinámico -->
  <main class="container">
    
    <!-- Sección de controles: Agrupa los inputs de búsqueda, filtros y ordenamiento -->
    <section class="controls">
      
      <!-- Grupo de control 1: Input de texto para la búsqueda por nombre  -->
      <div class="controls__group">
        <label for="search-input">Buscar por Nombre:</label>
        <!-- El id "search-input" es clave para capturar el evento 'input' o 'change' en JS -->
        <input type="text" id="search-input" placeholder="Ej: Batman, Spider-Man...">
      </div>

      <!-- Grupo de control 2: Filtro avanzado por editorial  -->
      <div class="controls__group">
        <label for="publisher-filter">Filtrar por Editorial:</label>
        <select id="publisher-filter">
          <option value="all">Todas las Editoriales</option>
          <option value="Marvel Comics">Marvel Comics</option>
          <option value="DC Comics">DC Comics</option>
          <option value="George Lucas">George Lucas</option>
          <option value="Dark Horse Comics">Dark Horse Comics</option>
          <option value="NBC - Heroes">NBC - Heroes</option>
          <option value="Image Comics">Image Comics</option>
        </select>
      </div>
      
      <!-- Grupo de control 3: Selector para ordenar de forma Alfabética  -->
      <div class="controls__group">
        <label for="sort-select">Orden Alfabético:</label>
        <select id="sort-select">
          <!-- Valores 'asc' y 'desc' para manipular el array de objetos en JavaScript -->
          <option value="asc">A - Z</option>
          <option value="desc">Z - A</option>
        </select>
      </div>
    </section>

    <!-- Contador dinámico de resultados  -->
    <div class="results-counter">
      <!-- El span con id "total-results" se modifica dinámicamente mediante innerText en JS -->
      <p>Resultados encontrados: <span id="total-results">0</span></p>
    </div>

    <!-- Grilla principal vacía: El Workspace donde JavaScript inyectará las tarjetas de los héroes -->
    <section class="heroes-grid" id="heroes-grid"></section>

    <!-- Barra de navegación para el paginado  -->
    <!-- Se incluye aria-label para cumplir con buenas prácticas de accesibilidad web (A11y) -->
    <nav class="pagination" aria-label="Paginado de héroes">
      <!-- Botón para saltar directo a la primera página de la búsqueda -->
      <button id="btn-first" class="pagination__btn" disabled>« Primero</button>
      <!-- Botón para retroceder una página -->
      <button id="btn-prev" class="pagination__btn" disabled>‹ Anterior</button>
      <!-- Indicador de la ubicación actual del usuario en la navegación -->
      <span id="page-info" class="pagination__info">Página 1</span>
      <!-- Botón para avanzar una página -->
      <button id="btn-next" class="pagination__btn" disabled>Siguiente ›</button>
      <!-- Botón para saltar directo a la última página calculada -->
      <button id="btn-last" class="pagination__btn" disabled>Último »</button>
    </nav>

  </main>

  <!-- Capa del Modal (Ventana emergente) para ver el detalle del personaje al hacer click -->
  <!-- Inicialmente oculto mediante CSS (display: none) -->
  <div id="hero-modal" class="modal">
    <!-- Contenedor blanco con los estilos de la tarjeta flotante -->
    <div class="modal__content">
      <!-- Botón con la entidad de cruz (&times;) para cerrar la ventana modal -->
      <button id="modal-close" class="modal__close">&times;</button>
      <!-- Contenedor interno donde JS inyectará de forma asíncrona la biografía y estadísticas -->
      <div id="modal-body">
        <!-- Se renderiza asíncronamente con Javascript -->
      </div>
    </div>
  </div>

  <!-- Pie de página  -->
  <footer class="footer">
    <p>&copy; 2026 - Proyecto FrontEnd modulo 2- Torres Camila Anahi</p>
  </footer>

  <!-- Punto de entrada limpio de JavaScript  -->
  <script src="js/main.js"></script>
</body>
</html>
